name: CamFlip
options:
  bundleIdPrefix: com.mrwaleeders
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  CamFlip:
    type: application
    platform: macOS
    sources:
      - path: CamFlip
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: CamFlip
        PRODUCT_BUNDLE_IDENTIFIER: $(CAMFLIP_BUNDLE_ID)
        INFOPLIST_FILE: CamFlip/Info.plist
        CODE_SIGN_ENTITLEMENTS: CamFlip/CamFlip.entitlements
        # Compile the .metal file as a Core Image (stitchable) kernel library.
        MTL_COMPILER_FLAGS: -fcikernel
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: CamFlipExtension
        embed: true
    scheme: {}
  CamFlipExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: CamFlipExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAMFLIP_BUNDLE_ID).Extension
        # A system extension bundle must be named after its bundle identifier.
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: CamFlipExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CamFlipExtension/CamFlipExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
