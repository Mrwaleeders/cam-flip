name: OBS plugin

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Headers the plugin is compiled against. Older headers = works on more OBS versions
  # (OBS refuses plugins built for a newer major version than itself).
  OBS_VERSION: "31.0.0"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: obs-plugin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: sw_vers && clang --version

      - name: Pixel and eye-contact behaviour tests
        run: |
          clang -O2 -Wall -Werror -Isrc tests/test_warp.c src/warp.c -o build_test_warp && ./build_test_warp
          clang -O2 -Wall -Werror -Isrc tests/test_gaze.c src/gaze.c src/warp.c src/pose.c -o build_test_gaze && ./build_test_gaze
          clang -O2 -Wall -Wextra -Werror -Isrc tests/test_ml_eye.c src/ml_eye.c src/warp.c -o build_test_ml_eye && ./build_test_ml_eye

      - name: Build plugin
        run: CAMFLIP_VERSION="1.0.${{ github.run_number }}" ./build.sh

      - name: Install OBS versions to test against (latest + 32.2.2)
        run: |
          brew install --cask obs
          mkdir -p /tmp/obs32
          url=$(gh api repos/obsproject/obs-studio/releases/tags/32.2.2 \
            -q '.assets[] | select(.name | test("macOS-Apple\\.dmg$")) | .browser_download_url' | head -1)
          echo "OBS 32.2.2: $url"
          curl -fsSL -o /tmp/obs32.dmg "$url"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/obs32mnt /tmp/obs32.dmg
          cp -R /tmp/obs32mnt/OBS.app /tmp/obs32/OBS.app
          hdiutil detach /tmp/obs32mnt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check every OBS function the plugin uses exists (both OBS versions)
        run: |
          nm -u -arch arm64 build/cam-flip.plugin/Contents/MacOS/cam-flip | grep -E '^_(obs|blog|bmalloc|bfree|bzalloc|gs)' | sort -u > /tmp/needed.txt
          cat /tmp/needed.txt
          for app in /Applications/OBS.app /tmp/obs32/OBS.app; do
            LIBOBS="$app/Contents/Frameworks/libobs.framework/Versions/A/libobs"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist"
            nm -gU "$LIBOBS" | awk '{print $NF}' | sort -u > /tmp/exported.txt
            missing=$(comm -23 /tmp/needed.txt /tmp/exported.txt)
            if [ -n "$missing" ]; then echo "Missing in $app: $missing"; exit 1; fi
          done
          echo "All OBS symbols resolve in both versions."

      - name: Build the diagnostic and eye-model tools (render, capture, extract)
        run: |
          FW=/Applications/OBS.app/Contents/Frameworks
          INC="-Ibuild/obs-studio-$OBS_VERSION/libobs -Ibuild/simde -Ibuild/include -Isrc"
          FWK="-framework Foundation -framework Vision -framework CoreVideo -framework CoreGraphics -framework ImageIO -framework AVFoundation -framework CoreMedia"
          clang -O2 -fobjc-arc $INC tools/render_video.m src/gaze.c src/warp.c src/pose.c src/ml_eye.c src/ml_model.m \
            -F"$FW" -framework libobs -Wl,-rpath,"$FW" $FWK -framework CoreML -o build/render_video
          clang -O2 -fobjc-arc $INC tools/model/extract_patches.m src/gaze.c src/warp.c src/pose.c src/ml_eye.c \
            -F"$FW" -framework libobs -Wl,-rpath,"$FW" $FWK -o build/extract_patches
          clang -O2 -Wall -fobjc-arc tools/model/capture_pairs.m -framework AppKit -framework AVFoundation \
            -framework CoreMedia -framework QuartzCore -o build/capture_pairs

      - name: Eye model, trained on synthetic eyes, through Core ML and the pixel code
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install -q -r tools/model/requirements.txt
          build/venv/bin/python tools/model/train.py --selftest --device cpu --selftest-export build/selftest.mlpackage
          clang -O2 -Wall -fobjc-arc -Isrc tests/test_ml_model.m src/ml_model.m src/ml_eye.c src/warp.c \
            -framework CoreML -framework Foundation -o build/test_ml_model
          ./build/test_ml_model build/selftest.mlpackage

      - name: Run filter against real libobs + Apple Vision (latest OBS)
        run: OBS_APP=/Applications/OBS.app ./tests/run_plugin_test.sh

      - name: Run filter against real libobs + Apple Vision (OBS 32.2.2)
        run: OBS_APP=/tmp/obs32/OBS.app ./tests/run_plugin_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cam-flip-obs-macos
          path: obs-plugin/build/cam-flip-obs-macos.zip

      - name: Publish download (main branch)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/cam-flip-obs-macos.zip \
            --title "Cam Flip for OBS (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Install steps: see the README." \
            --target "$GITHUB_SHA"
